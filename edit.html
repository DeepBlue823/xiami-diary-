<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写日记 - 小咪的日记本</title>
    <style>
        :root {
            --summer-ink: #2f5f6b;
            --summer-ink-soft: #4f8891;
            --summer-coral: #ff7f72;
            --summer-coral-deep: #e96558;
            --summer-sun: #ffd166;
            --summer-mint: #94d9bd;
            --summer-sky: #bfeeff;
            --summer-wave: #7bd5ee;
            --summer-sea: #8ee1d2;
            --summer-cream: #fff8d8;
            --summer-paper: #fbfff6;
            --summer-card: rgba(255, 255, 255, 0.78);
            --summer-line: #b8eadf;
            --summer-shadow: rgba(47, 95, 107, 0.13);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "STSong", "SimSun", serif;
            background:
                repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0 1px, transparent 1px 22px),
                linear-gradient(180deg, #cef4ff 0%, #f7fdff 31%, var(--summer-cream) 58%, #d7f7e9 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                linear-gradient(112deg, transparent 0 12%, rgba(255, 209, 102, 0.24) 12% 14%, transparent 14% 100%),
                linear-gradient(69deg, transparent 0 74%, rgba(123, 213, 238, 0.28) 74% 76%, transparent 76% 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 34%);
        }

        body::after {
            content: '';
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 36vh;
            pointer-events: none;
            z-index: 0;
            background:
                repeating-linear-gradient(172deg, transparent 0 30px, rgba(255, 255, 255, 0.24) 30px 32px),
                linear-gradient(180deg, transparent 0%, rgba(123, 213, 238, 0.14) 30%, rgba(142, 225, 210, 0.22) 68%, rgba(255, 209, 102, 0.2) 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 36%);
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
            position: relative;
        }

        header::after {
            content: '';
            display: block;
            width: min(420px, 72vw);
            height: 8px;
            margin: 16px auto 0;
            background:
                linear-gradient(90deg, transparent, rgba(255, 127, 114, 0.34), rgba(255, 209, 102, 0.42), rgba(148, 217, 189, 0.34), transparent);
            border-radius: 999px;
        }

        h1 {
            font-size: 2.5em;
            color: var(--summer-ink);
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.82), 0 10px 20px rgba(47, 95, 107, 0.11);
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 1.2em;
            color: var(--summer-ink-soft);
            font-style: italic;
        }

        .diary-card {
            background: var(--summer-card);
            border-radius: 18px;
            box-shadow: 0 18px 42px var(--summer-shadow);
            padding: 40px;
            position: relative;
            border: 1px solid var(--summer-line);
            backdrop-filter: blur(14px);
            overflow: hidden;
        }

        .diary-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255, 209, 102, 0.14), transparent 28%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.58), transparent 38%);
        }

        .diary-card > * {
            position: relative;
            z-index: 1;
        }


        .input-group {
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        label {
            display: block;
            font-size: 1.1em;
            color: var(--summer-ink);
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--summer-line);
            border-radius: 10px;
            font-size: 1.1em;
            font-family: inherit;
            background: #fbfffb;
            color: var(--summer-ink);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--summer-coral);
            box-shadow: 0 0 10px rgba(255, 127, 114, 0.22);
        }

        textarea {
            min-height: 250px;
            resize: vertical;
            line-height: 1.8;
        }

        .mood-selector {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .mood-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--summer-line);
            background: #fbfffb;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-btn:hover {
            transform: scale(1.1);
        }

        .mood-btn.selected {
            border-color: var(--summer-coral);
            background: #fff3c4;
            transform: scale(1.15);
        }

        .writer-btn {
            width: auto;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 1em;
        }

        .writer-btn.selected {
            background: var(--summer-coral);
            color: white;
            border-color: var(--summer-coral);
        }

        .edit-btn {
            background: none;
            border: none;
            color: var(--summer-ink-soft);
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px 10px;
            margin-right: 5px;
            transition: color 0.3s;
        }

        .edit-btn:hover {
            color: var(--summer-ink);
        }

        .diary-item .meta-info {
            display: flex;
            gap: 10px;
            font-size: 0.8em;
            color: var(--summer-ink-soft);
            margin-top: 5px;
        }

        .diary-item .writer-badge {
            background: var(--summer-coral);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--summer-coral), var(--summer-sun));
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 127, 114, 0.28);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(255, 127, 114, 0.35);
            background: linear-gradient(135deg, var(--summer-coral-deep), #f6b44f);
        }

        .btn-secondary {
            background: #fff;
            color: var(--summer-ink);
            border: 2px solid var(--summer-line);
        }

        .btn-secondary:hover {
            background: #fff3c4;
            border-color: var(--summer-coral);
        }

        .diary-list {
            margin-top: 40px;
        }

        .diary-list h2 {
            color: var(--summer-ink);
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 0;
            padding-bottom: 16px;
            position: relative;
        }

        .diary-list h2::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(520px, 84vw);
            height: 3px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, var(--summer-line), var(--summer-sun), var(--summer-line), transparent);
            border-radius: 999px;
        }

        .diary-item {
            background: var(--summer-card);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 14px 32px rgba(47, 95, 107, 0.1);
            border: 1px solid rgba(184, 234, 223, 0.78);
            border-left: 5px solid var(--summer-coral);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .diary-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(55, 151, 164, 0.18);
        }

        .diary-item .date {
            color: var(--summer-ink-soft);
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .diary-item .title {
            color: var(--summer-ink);
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .diary-item .preview {
            color: #4f7f83;
            font-size: 0.95em;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .diary-item.expanded .preview {
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .diary-item .expand-hint {
            color: var(--summer-ink-soft);
            font-size: 0.85em;
            text-align: right;
            margin-top: 8px;
            font-style: italic;
        }

        .diary-item .mood {
            font-size: 1.2em;
            margin-top: 10px;
        }

        .delete-btn {
            float: right;
            background: none;
            border: none;
            color: #e0b0c0;
            cursor: pointer;
            font-size: 1.2em;
            padding: 5px;
            transition: color 0.3s;
        }

        .delete-btn:hover {
            color: #d32f2f;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--summer-coral), var(--summer-sun));
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 24px rgba(255, 127, 114, 0.28);
            transition: transform 0.5s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            color: var(--summer-ink-soft);
            padding: 40px;
            font-style: italic;
        }

        /* 登录弹窗 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(47, 95, 107, 0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--summer-line);
            box-shadow: 0 18px 44px rgba(55, 151, 164, 0.22);
            backdrop-filter: blur(14px);
        }

        .login-box h2 {
            color: var(--summer-ink);
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--summer-line);
            border-radius: 10px;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .login-box .btn {
            width: 100%;
        }

        .login-error {
            color: #d32f2f;
            margin-bottom: 15px;
            display: none;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--summer-line);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            color: var(--summer-ink);
            transition: all 0.3s;
            z-index: 10;
        }

        .logout-btn:hover {
            background: #fff3c4;
            border-color: var(--summer-coral);
        }

        button:disabled { opacity: 0.6; cursor: wait; }

        /* 夏日小物件飘落动画 */
        @keyframes summerDrift {
            0% {
                transform: translate3d(0, -36px, 0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: var(--drift-opacity, 0.72); }
            28% { transform: translate3d(var(--sway-a, 28px), 28vh, 0) rotate(86deg); }
            52% { transform: translate3d(var(--sway-b, -18px), 54vh, 0) rotate(174deg); }
            78% { transform: translate3d(var(--sway-c, 22px), 82vh, 0) rotate(268deg); }
            100% {
                transform: translate3d(0, 110vh, 0) rotate(360deg);
                opacity: 0;
            }
        }

        .summer-drift {
            position: fixed;
            top: 0;
            pointer-events: none;
            z-index: 0;
            animation: summerDrift linear infinite;
            animation-fill-mode: both;
            opacity: 0;
            user-select: none;
            line-height: 1;
            filter: drop-shadow(0 6px 7px rgba(47, 95, 107, 0.1));
        }

        @media (max-width: 600px) {
            .diary-card {
                padding: 25px;
            }


            h1 {
                font-size: 1.8em;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .summer-drift {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="logout()">退出登录</button>

    <div class="container" inert>
        <header>
            <h1>写日记</h1>
            <div class="date-display" id="currentDate"></div>
        </header>

        <div class="diary-card">
            <div class="input-group">
                <label for="diaryTitle">今日标题</label>
                <input type="text" id="diaryTitle" maxlength="200" placeholder="给今天起个标题吧...">
            </div>

            <div class="input-group">
                <label for="diaryDate">日记日期</label>
                <input type="date" id="diaryDate">
            </div>

            <div class="input-group">
                <label>今日心情</label>
                <div class="mood-selector">
                    <button class="mood-btn" data-mood="happy" title="开心">😊</button>
                    <button class="mood-btn" data-mood="love" title="甜蜜">😍</button>
                    <button class="mood-btn" data-mood="peaceful" title="平静">😌</button>
                    <button class="mood-btn" data-mood="sad" title="难过">😢</button>
                    <button class="mood-btn" data-mood="angry" title="生气">😤</button>
                    <button class="mood-btn" data-mood="tired" title="疲惫">😴</button>
                </div>
            </div>

            <div class="input-group">
                <label for="girlfriendLocation">小咪所在地</label>
                <input type="text" id="girlfriendLocation" maxlength="200" placeholder="小咪现在在哪里呢？">
            </div>

            <div class="input-group">
                <label for="myLocation">我的所在地</label>
                <input type="text" id="myLocation" maxlength="200" placeholder="我现在在哪里呢？">
            </div>

            <div class="input-group">
                <label for="diaryContent">今日记录</label>
                <textarea id="diaryContent" maxlength="100000" placeholder="今天发生了什么有趣的事情呢？"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="saveDiaryButton" onclick="saveDiary()">保存日记</button>
                <button class="btn btn-secondary" onclick="clearForm()">清空</button>
            </div>
        </div>

        <!-- 见面日期管理 -->
        <div class="diary-card" style="margin-top: 30px;">
            <h2 style="color: var(--summer-ink); font-size: 1.3em; margin-bottom: 20px; text-align: center;">见面日期管理</h2>

            <div class="input-group">
                <label>添加见面日期</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="date" id="newMeetingStart" aria-label="见面开始日期" style="flex: 1;">
                    <span>至</span>
                    <input type="date" id="newMeetingEnd" aria-label="见面结束日期" style="flex: 1;">
                    <button class="btn btn-primary" onclick="addMeeting()">添加</button>
                </div>
            </div>

            <div id="meetingsList"></div>
        </div>

        <div class="diary-list">
            <h2>所有日记</h2>
            <div id="diaryListContent"></div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>请输入密码</h2>
            <div class="login-error" id="loginError" role="alert">密码错误，请重试</div>
            <input type="password" id="password" placeholder="请输入管理密码" autocomplete="current-password" onkeydown="handleEnter(event)">
            <button class="btn btn-primary" id="loginButton" onclick="login()">登录</button>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">保存成功啦～</div>

    <script>
        let authToken = '';
        try { authToken = localStorage.getItem('xiami_token') || ''; } catch (_) {}
        let selectedMood = null;
        let editingId = null;
        let diariesCache = [];
        let mutationPending = false;
        let loginPending = false;
        let toastTimer;
        let diaryRequest = 0;
        let meetingRequest = 0;
        const diaryFieldIds = ['diaryTitle', 'diaryContent', 'diaryDate', 'girlfriendLocation', 'myLocation'];
        const editor = document.querySelector('.container');

        function rememberToken(token) {
            authToken = token;
            try {
                if (token) localStorage.setItem('xiami_token', token);
                else localStorage.removeItem('xiami_token');
            } catch (_) { /* 当前页面仍可使用内存中的登录状态。 */ }
        }

        function showLogin(message = '') {
            document.getElementById('loginOverlay').style.display = 'flex';
            editor.inert = true;
            const error = document.getElementById('loginError');
            error.textContent = message;
            error.style.display = message ? 'block' : 'none';
            document.getElementById('password').focus();
        }

        function hideLogin() {
            document.getElementById('loginOverlay').style.display = 'none';
            editor.inert = false;
        }

        async function requestJSON(url, options = {}, requiresAuth = false) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            try {
                const response = await fetch(url, {
                    ...options,
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: {
                        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                        ...(requiresAuth ? { Authorization: `Bearer ${authToken}` } : {}),
                        ...options.headers
                    }
                });
                if (response.status === 401 && requiresAuth) {
                    rememberToken('');
                    showLogin('登录已过期，请重新登录。未保存的内容仍在。');
                    throw new Error('登录已过期，请重新登录');
                }
                let data;
                try { data = await response.json(); }
                catch (_) { throw new Error('服务器暂时无法响应，请稍后重试'); }
                if (!response.ok) throw new Error(data.error || '请求失败，请稍后重试');
                return data;
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('请求超时，请先刷新列表确认操作结果，再重试');
                if (error instanceof TypeError) throw new Error('网络连接失败，请稍后重试');
                throw error;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function checkAuth() {
            if (!authToken) { showLogin(); return false; }
            try {
                const data = await requestJSON('/api/auth', { method: 'GET' }, true);
                if (!data.success) throw new Error('登录状态校验失败，请重新登录');
                hideLogin();
                return true;
            } catch (error) {
                showLogin(error.message);
                return false;
            }
        }

        async function login() {
            if (loginPending) return;
            const input = document.getElementById('password');
            if (!input.value) { showLogin('请输入管理密码'); return; }
            loginPending = true;
            const button = document.getElementById('loginButton');
            button.disabled = true;
            button.textContent = '登录中…';
            document.getElementById('loginError').style.display = 'none';
            try {
                const data = await requestJSON('/api/auth', {
                    method: 'POST', body: JSON.stringify({ password: input.value })
                });
                if (!data.success || typeof data.token !== 'string') throw new Error('登录失败，请重试');
                rememberToken(data.token);
                input.value = '';
                hideLogin();
                await Promise.all([fetchDiaries(), fetchMeetings()]);
            } catch (error) {
                showLogin(error.message);
            } finally {
                loginPending = false;
                button.disabled = false;
                button.textContent = '登录';
            }
        }

        async function logout() {
            if (mutationPending || !canDiscardDraft()) return;
            const button = document.querySelector('.logout-btn');
            button.disabled = true;
            try {
                await requestJSON('/api/auth', { method: 'DELETE' }, true);
                rememberToken('');
                clearForm(true);
                showLogin();
            } catch (error) { showToast(error.message); }
            finally { button.disabled = false; }
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.isComposing) {
                event.preventDefault();
                login();
            }
        }

        function updateDate() {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-CN', {
                year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
            });
        }

        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.setAttribute('aria-pressed', 'false');
            btn.addEventListener('click', () => setMood(btn.dataset.mood));
        });

        function setMood(mood) {
            selectedMood = null;
            document.querySelectorAll('.mood-btn').forEach(button => {
                const selected = button.dataset.mood === mood;
                button.classList.toggle('selected', selected);
                button.setAttribute('aria-pressed', String(selected));
                if (selected) selectedMood = mood;
            });
        }

        function draftState() {
            return JSON.stringify([editingId, selectedMood, ...diaryFieldIds.map(id => document.getElementById(id).value)]);
        }
        let savedDraftState = draftState();
        function canDiscardDraft() {
            return draftState() === savedDraftState || confirm('有尚未保存的日记内容，确定放弃吗？');
        }
        window.addEventListener('beforeunload', event => {
            if (draftState() !== savedDraftState) {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        async function runMutation(callback) {
            if (mutationPending) return;
            if (!authToken) { showLogin('请先登录，未保存的内容仍在。'); return; }
            mutationPending = true;
            const controls = [...document.querySelectorAll('.container input, .container textarea, .container button, .logout-btn')];
            const disabledStates = controls.map(control => control.disabled);
            controls.forEach(control => { control.disabled = true; });
            try { await callback(); }
            catch (error) { showToast(error.message); }
            finally {
                controls.forEach((control, index) => { control.disabled = disabledStates[index]; });
                mutationPending = false;
                document.getElementById('saveDiaryButton').textContent = editingId !== null ? '更新日记' : '保存日记';
            }
        }

        async function writeData(method, body) {
            const data = await requestJSON('/api/diaries', { method, body: JSON.stringify(body) }, true);
            if (!data.success) throw new Error(data.error || '操作失败，请重试');
            return data;
        }

        async function saveDiary() {
            const title = document.getElementById('diaryTitle').value.trim();
            const content = document.getElementById('diaryContent').value.trim();
            if (!title && !content) { showToast('请写点什么吧～'); return; }
            await runMutation(async () => {
                document.getElementById('saveDiaryButton').textContent = '保存中…';
                const body = {
                    title: title || '无标题', content, mood: selectedMood,
                    date: document.getElementById('diaryDate').value || null,
                    girlfriendLocation: document.getElementById('girlfriendLocation').value.trim() || null,
                    myLocation: document.getElementById('myLocation').value.trim() || null
                };
                if (editingId !== null) body.id = editingId;
                await writeData('POST', body);
                clearForm(true);
                showToast('保存成功啦～');
                await fetchDiaries();
            });
        }

        function editDiary(id) {
            if (mutationPending) return;
            const diary = diariesCache.find(item => String(item.id) === String(id));
            if (!diary || !canDiscardDraft()) return;
            document.getElementById('diaryTitle').value = diary.title || '';
            document.getElementById('diaryContent').value = diary.content || '';
            document.getElementById('diaryDate').value = typeof diary.date === 'string' ? diary.date.split('T')[0] : '';
            document.getElementById('girlfriendLocation').value = diary.girlfriendLocation || '';
            document.getElementById('myLocation').value = diary.myLocation || '';
            setMood(diary.mood);
            editingId = diary.id;
            savedDraftState = draftState();
            document.getElementById('saveDiaryButton').textContent = '更新日记';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearForm(force = false) {
            if (!force && (mutationPending || !canDiscardDraft())) return;
            diaryFieldIds.forEach(id => { document.getElementById(id).value = ''; });
            setMood(null);
            editingId = null;
            savedDraftState = draftState();
            document.getElementById('saveDiaryButton').textContent = '保存日记';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function appendText(parent, tag, className, text) {
            const node = document.createElement(tag);
            node.className = className;
            node.textContent = String(text ?? '');
            parent.appendChild(node);
            return node;
        }

        function listError(container, message, retry) {
            const error = document.createElement('div');
            error.className = 'empty-state load-error';
            error.textContent = message + ' ';
            const button = appendText(error, 'button', 'edit-btn', '重试');
            button.addEventListener('click', retry);
            container.querySelector('.load-error')?.remove();
            container.prepend(error);
        }

        async function fetchDiaries() {
            const request = ++diaryRequest;
            try {
                const diaries = await requestJSON('/api/diaries');
                if (!Array.isArray(diaries)) throw new Error('日记数据格式异常');
                if (request !== diaryRequest) return;
                diariesCache = diaries.filter(item => item && typeof item === 'object');
                renderDiaryList(diariesCache);
            } catch (error) {
                if (request === diaryRequest) listError(document.getElementById('diaryListContent'), '加载日记失败：' + error.message, fetchDiaries);
            }
        }

        function renderDiaryList(diaries) {
            const container = document.getElementById('diaryListContent');
            container.replaceChildren();
            if (!diaries.length) { appendText(container, 'div', 'empty-state', '还没有日记呢，开始写第一篇吧～'); return; }
            const moods = { happy: '😊', love: '😍', peaceful: '😌', sad: '😢', angry: '😤', tired: '😴' };
            const fragment = document.createDocumentFragment();
            [...diaries].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(diary => {
                const item = document.createElement('div');
                item.className = 'diary-item';
                item.dataset.id = String(diary.id);
                // 装饰是固定模板；所有保存的数据仅作为文本插入。
                item.innerHTML = diaryCardFlowers();
                const actions = appendText(item, 'div', '', '');
                actions.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
                const edit = appendText(actions, 'button', 'edit-btn', '编辑');
                edit.addEventListener('click', event => { event.stopPropagation(); editDiary(diary.id); });
                const remove = appendText(actions, 'button', 'delete-btn', '×');
                remove.setAttribute('aria-label', '删除日记');
                remove.addEventListener('click', event => { event.stopPropagation(); deleteDiary(diary.id); });
                const date = new Date(diary.date);
                appendText(item, 'div', 'date', Number.isNaN(date.getTime()) ? '日期未知' : date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }));
                appendText(item, 'div', 'title', diary.title || '无标题');
                appendText(item, 'div', 'preview', diary.content);
                if (Object.prototype.hasOwnProperty.call(moods, diary.mood)) appendText(item, 'div', 'mood', moods[diary.mood]);
                const meta = appendText(item, 'div', 'meta-info', '');
                if (diary.girlfriendLocation) appendText(meta, 'span', '', '📍 小咪: ' + diary.girlfriendLocation);
                if (diary.myLocation) appendText(meta, 'span', '', '📍 哥哥: ' + diary.myLocation);
                item.addEventListener('click', () => {
                    item.classList.toggle('expanded');
                    const hint = item.querySelector('.expand-hint');
                    if (item.classList.contains('expanded') && !hint) appendText(item, 'div', 'expand-hint', '点击收起');
                    else if (hint) hint.remove();
                });
                fragment.appendChild(item);
            });
            container.appendChild(fragment);
        }

        async function deleteDiary(id) {
            if (mutationPending || !confirm('确定要删除这篇日记吗？')) return;
            if (String(editingId) === String(id) && !canDiscardDraft()) return;
            await runMutation(async () => {
                await writeData('DELETE', { id });
                if (String(editingId) === String(id)) clearForm(true);
                showToast('已删除');
                await fetchDiaries();
            });
        }

        async function fetchMeetings() {
            const request = ++meetingRequest;
            try {
                const meetings = await requestJSON('/api/diaries?action=meetings');
                if (!Array.isArray(meetings)) throw new Error('见面日期数据格式异常');
                if (request === meetingRequest) renderMeetings(meetings.filter(item => item && typeof item === 'object'));
            } catch (error) {
                if (request === meetingRequest) listError(document.getElementById('meetingsList'), '加载见面日期失败：' + error.message, fetchMeetings);
            }
        }

        function renderMeetings(meetings) {
            const container = document.getElementById('meetingsList');
            container.replaceChildren();
            if (!meetings.length) { appendText(container, 'div', 'empty-state', '还没有见面日期记录'); return; }
            meetings.forEach(meeting => {
                const item = appendText(container, 'div', 'diary-item', '');
                item.style.cursor = 'default';
                const row = appendText(item, 'div', '', '');
                row.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
                const dateText = value => {
                    const date = new Date(typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) ? value + 'T00:00:00' : value);
                    return Number.isNaN(date.getTime()) ? '日期未知' : date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
                };
                appendText(row, 'span', '', `🤍 ${dateText(meeting.startDate)} - ${dateText(meeting.endDate)}`);
                const remove = appendText(row, 'button', 'delete-btn', '×');
                remove.setAttribute('aria-label', '删除见面日期');
                remove.addEventListener('click', () => deleteMeeting(meeting.id));
            });
        }

        async function addMeeting() {
            const startDate = document.getElementById('newMeetingStart').value;
            const endDate = document.getElementById('newMeetingEnd').value;
            if (!startDate || !endDate) { showToast('请选择开始和结束日期'); return; }
            if (endDate < startDate) { showToast('结束日期不能早于开始日期'); return; }
            await runMutation(async () => {
                await writeData('POST', { action: 'addMeeting', startDate, endDate });
                document.getElementById('newMeetingStart').value = '';
                document.getElementById('newMeetingEnd').value = '';
                showToast('添加成功');
                await fetchMeetings();
            });
        }

        async function deleteMeeting(id) {
            if (mutationPending || !confirm('确定删除这个见面日期吗？')) return;
            await runMutation(async () => {
                await writeData('DELETE', { action: 'deleteMeeting', id });
                showToast('已删除');
                await fetchMeetings();
            });
        }

        // 创建轻量夏日光影：小浪纹、星芒和薄荷叶。
        function createSummerDrifts() {
            const pieces = [
                (size) => `<svg width="${size * 1.8}" height="${size}" viewBox="0 0 64 34" xmlns="http://www.w3.org/2000/svg"><path d="M5 19c8-9 15-9 23 0s15 9 23 0" fill="none" stroke="#7bd5ee" stroke-width="3" stroke-linecap="round" opacity="0.72"/><path d="M13 25c6-5 12-5 18 0s12 5 18 0" fill="none" stroke="#94d9bd" stroke-width="2" stroke-linecap="round" opacity="0.58"/></svg>`,
                (size) => `<svg width="${size}" height="${size}" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><g stroke="#ffd166" stroke-width="2.4" stroke-linecap="round"><line x1="22" y1="7" x2="22" y2="16"/><line x1="22" y1="28" x2="22" y2="37"/><line x1="7" y1="22" x2="16" y2="22"/><line x1="28" y1="22" x2="37" y2="22"/><line x1="12" y1="12" x2="17" y2="17"/><line x1="27" y1="27" x2="32" y2="32"/><line x1="32" y1="12" x2="27" y2="17"/><line x1="17" y1="27" x2="12" y2="32"/></g><circle cx="22" cy="22" r="4.5" fill="#ffe59b"/></svg>`,
                (size) => `<svg width="${size}" height="${size * 1.25}" viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg"><path d="M8 39C9 23 20 10 34 6c-2 17-12 30-26 33Z" fill="#94d9bd" opacity="0.72"/><path d="M10 37c8-8 14-18 22-29" fill="none" stroke="#4f8891" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/></svg>`,
                (size) => `<svg width="${size}" height="${size}" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="7" fill="#fff8d8" opacity="0.88"/><circle cx="22" cy="22" r="13" fill="none" stroke="#bfeeff" stroke-width="2" opacity="0.58"/></svg>`
            ];

            for (let i = 0; i < 26; i++) {
                const drift = document.createElement('div');
                drift.className = 'summer-drift';
                const size = Math.random() * 10 + 16;
                const piece = pieces[Math.floor(Math.random() * pieces.length)];
                drift.innerHTML = piece(size);
                drift.style.left = Math.random() * 100 + 'vw';
                drift.style.animationDuration = (Math.random() * 8 + 10) + 's';
                drift.style.animationDelay = (Math.random() * 12) + 's';
                drift.style.setProperty('--drift-opacity', (Math.random() * 0.26 + 0.48).toString());
                drift.style.setProperty('--sway-a', (Math.random() * 42 - 8) + 'px');
                drift.style.setProperty('--sway-b', (Math.random() * -34 - 8) + 'px');
                drift.style.setProperty('--sway-c', (Math.random() * 38 - 10) + 'px');
                document.body.appendChild(drift);
            }
        }

        // 日记卡片夏日角落装饰
        function diaryCardFlowers() {
            const wave = '<svg width="52" height="22" viewBox="0 0 72 30" xmlns="http://www.w3.org/2000/svg"><path d="M4 17c9-8 17-8 26 0s17 8 26 0" fill="none" stroke="#7bd5ee" stroke-width="3" stroke-linecap="round" opacity="0.72"/><path d="M14 23c7-5 13-5 20 0s13 5 20 0" fill="none" stroke="#94d9bd" stroke-width="2" stroke-linecap="round" opacity="0.56"/></svg>';
            const glint = '<svg width="18" height="18" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><g stroke="#ffd166" stroke-width="3" stroke-linecap="round"><line x1="22" y1="6" x2="22" y2="16"/><line x1="22" y1="28" x2="22" y2="38"/><line x1="6" y1="22" x2="16" y2="22"/><line x1="28" y1="22" x2="38" y2="22"/></g><circle cx="22" cy="22" r="4" fill="#ffe59b"/></svg>';
            const leaf = (rot) => `<svg width="15" height="22" viewBox="0 0 20 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 28C5 15 11 7 18 3c-2 9-6 18-14 25Z" fill="#8ee1d2" opacity="0.82" transform="rotate(${rot},10,16)"/></svg>`;
            return `
                <div style="position:absolute;top:-12px;right:12px;display:flex;align-items:center;gap:3px;pointer-events:none;">
                    ${leaf(-8)}${wave}${glint}
                </div>
                <div style="position:absolute;bottom:-12px;left:10px;display:flex;align-items:center;gap:3px;pointer-events:none;">
                    ${glint}${wave}${leaf(10)}
                </div>`;
        }

        // 初始化
        createSummerDrifts();
        updateDate();
        checkAuth().then(isLoggedIn => {
            if (isLoggedIn) {
                fetchDiaries();
                fetchMeetings();
            }
        });
    </script>
</body>
</html>
